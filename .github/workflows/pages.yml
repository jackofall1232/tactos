# Deploys website/ to GitHub Pages.
#
# ONE-TIME SETUP (required before the first deploy can succeed):
# the maintainer must enable Pages for this repository:
#   repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Until then, the deploy step will fail with a "Pages not enabled" error.

name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
